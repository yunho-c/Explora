[package]
name = "explora"
version = "0.1.0"
description = "A calm, modern file explorer for local and SSH locations"
authors = ["Explora contributors"]
edition = "2021"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "explora_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
glob = "0.3.3"
russh = "0.62.2"
russh-config = "0.58.0"
russh-sftp = "2.3.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.150"
sysinfo = "0.37.2"
tauri = { version = "2", features = [] }
tauri-plugin-decoration = "=2.1.4"
tempfile = "3.27.0"
thiserror = "2.0.19"
tokio = { version = "1.48.0", features = ["sync", "time"] }
uuid = { version = "1.24.0", features = ["v4", "v5"] }
zeroize = "1.8.2"

[target.'cfg(target_os = "macos")'.dependencies]
dispatch2 = "0.3.1"
objc2-core-foundation = "0.3.2"
objc2-disk-arbitration = "0.3.2"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5.12.0", default-features = false, features = ["blocking"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader"] }
