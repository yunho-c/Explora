[package]
name = "explora"
version = "0.1.0"
description = "A calm, modern file explorer for local and SSH locations"
authors = ["Explora contributors"]
edition = "2021"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "explora_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
encoding_rs = "0.8.35"
glob = "0.3.3"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff"] }
portable-pty = "=0.9.0"
russh = "0.62.2"
russh-config = "0.58.0"
russh-sftp = "2.3.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.150"
sysinfo = "0.37.2"
tauri = { version = "2", features = [] }
tauri-plugin-decoration = "=2.1.4"
tauri-plugin-opener = "=2.5.4"
tempfile = "3.27.0"
thiserror = "2.0.19"
tokio = { version = "1.48.0", features = ["fs", "io-util", "sync", "time"] }
trash = "5.2.6"
uuid = { version = "1.24.0", features = ["v4", "v5"] }
zeroize = "1.8.2"

[dev-dependencies]
futures = "0.3.31"
rand = "0.10.0"
tokio = { version = "1.48.0", features = ["macros", "net", "rt-multi-thread"] }

[target.'cfg(target_os = "macos")'.dependencies]
dispatch2 = "0.3.1"
libc = "=0.2.186"
objc2-core-foundation = "0.3.2"
objc2-disk-arbitration = "0.3.2"
rustix = { version = "1.1.4", features = ["fs"] }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1.4", features = ["fs"] }
zbus = { version = "5.12.0", default-features = false, features = ["blocking"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader", "Win32_Storage_FileSystem"] }
